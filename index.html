<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бесплатный Wi-Fi 🐒</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFD600;
    --orange: #FF6B00;
    --red: #FF2D2D;
    --dark: #1a1a1a;
    --white: #fff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: var(--dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    font-family: 'Nunito', sans-serif;
    overflow-x: hidden;
    padding: 0;
    position: relative;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,214,0,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(255,107,0,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(26,26,26,1) 0%, #111 100%);
    z-index: 0;
    animation: bgPulse 4s ease-in-out infinite alternate;
  }

  @keyframes bgPulse {
    from { opacity: 1; }
    to { opacity: 0.85; }
  }

  /* WiFi icon decorations */
  .wifi-deco {
    position: fixed;
    font-size: 6rem;
    opacity: 0.04;
    pointer-events: none;
    z-index: 0;
    animation: float 6s ease-in-out infinite;
  }
  .wifi-deco:nth-child(1) { top: 5%; left: 3%; animation-delay: 0s; }
  .wifi-deco:nth-child(2) { top: 20%; right: 5%; font-size: 4rem; animation-delay: 1s; }
  .wifi-deco:nth-child(3) { bottom: 20%; left: 8%; font-size: 5rem; animation-delay: 2s; }
  .wifi-deco:nth-child(4) { bottom: 5%; right: 3%; font-size: 7rem; animation-delay: 0.5s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-20px) rotate(5deg); }
  }

  /* Header */
  .header {
    position: relative;
    z-index: 10;
    width: 100%;
    text-align: center;
    padding: 32px 20px 20px;
  }

  .header-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    color: var(--dark);
    font-size: 0.72rem;
    font-weight: 900;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 6px 18px;
    border-radius: 20px;
    margin-bottom: 16px;
    animation: badgePop 0.6s cubic-bezier(.36,1.6,.6,1) both;
  }

  @keyframes badgePop {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .headline {
    font-family: 'Russo One', sans-serif;
    font-size: clamp(1.6rem, 5vw, 3.2rem);
    color: var(--white);
    line-height: 1.15;
    letter-spacing: -0.01em;
    animation: slideDown 0.7s cubic-bezier(.36,1.4,.6,1) 0.15s both;
    text-shadow: 0 0 40px rgba(255,214,0,0.25);
  }

  .headline span {
    background: linear-gradient(90deg, var(--yellow) 0%, var(--orange) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  @keyframes slideDown {
    from { transform: translateY(-30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* Image section */
  .image-wrap {
    position: relative;
    z-index: 10;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 20px;
  }

  .image-frame {
    position: relative;
    animation: popIn 0.8s cubic-bezier(.36,1.5,.6,1) 0.3s both;
  }

  @keyframes popIn {
    from { transform: scale(0.5) rotate(-8deg); opacity: 0; }
    to { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .image-frame::before {
    content: '';
    position: absolute;
    inset: -4px;
    background: linear-gradient(135deg, var(--yellow), var(--orange), var(--red));
    border-radius: 32px;
    z-index: -1;
    animation: rotateBorder 3s linear infinite;
  }

  @keyframes rotateBorder {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  .monkey-img {
    width: clamp(240px, 60vw, 380px);
    height: clamp(240px, 60vw, 380px);
    object-fit: cover;
    border-radius: 28px;
    display: block;
    position: relative;
    z-index: 1;
  }

  /* Reaction emojis flying out */
  .emoji-burst {
    position: absolute;
    font-size: 2rem;
    pointer-events: none;
    animation: burstOut 2s ease-out infinite;
    z-index: 20;
  }
  .emoji-burst:nth-child(1) { top: 10%; left: -10%; animation-delay: 0s; }
  .emoji-burst:nth-child(2) { top: -10%; left: 30%; animation-delay: 0.4s; }
  .emoji-burst:nth-child(3) { top: 10%; right: -10%; animation-delay: 0.8s; }
  .emoji-burst:nth-child(4) { bottom: -5%; left: 10%; animation-delay: 1.2s; }
  .emoji-burst:nth-child(5) { bottom: -5%; right: 10%; animation-delay: 1.6s; }

  @keyframes burstOut {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx, 30px), var(--ty, -50px)) scale(0.3); opacity: 0; }
  }
  .emoji-burst:nth-child(1) { --tx: -40px; --ty: -60px; }
  .emoji-burst:nth-child(2) { --tx: 0px; --ty: -70px; }
  .emoji-burst:nth-child(3) { --tx: 40px; --ty: -60px; }
  .emoji-burst:nth-child(4) { --tx: -30px; --ty: 40px; }
  .emoji-burst:nth-child(5) { --tx: 30px; --ty: 40px; }

  /* Counter section */
  .counter-section {
    position: relative;
    z-index: 10;
    width: 100%;
    padding: 20px 20px 36px;
    text-align: center;
  }

  .counter-label {
    color: rgba(255,255,255,0.5);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 12px;
    animation: fadeIn 1s ease 0.8s both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .counter-box {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,214,0,0.2);
    border-radius: 20px;
    padding: 14px 28px;
    animation: fadeIn 1s ease 1s both;
    backdrop-filter: blur(10px);
  }

  .counter-icon {
    font-size: 1.8rem;
    animation: wiggle 2s ease-in-out infinite;
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-10deg); }
    75% { transform: rotate(10deg); }
  }

  .counter-number {
    font-family: 'Russo One', sans-serif;
    font-size: clamp(2rem, 8vw, 3rem);
    background: linear-gradient(90deg, var(--yellow), var(--orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    min-width: 3ch;
    transition: transform 0.3s cubic-bezier(.36,1.6,.6,1);
  }

  .counter-number.bump {
    transform: scale(1.3);
  }

  .counter-suffix {
    color: rgba(255,255,255,0.6);
    font-size: 0.85rem;
    font-weight: 700;
    text-align: left;
    line-height: 1.3;
  }

  .counter-suffix strong {
    display: block;
    color: var(--white);
    font-size: 1rem;
  }

  /* New visitor toast */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    color: var(--dark);
    font-weight: 900;
    font-size: 0.9rem;
    padding: 10px 24px;
    border-radius: 40px;
    opacity: 0;
    transition: all 0.4s cubic-bezier(.36,1.6,.6,1);
    z-index: 100;
    white-space: nowrap;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<!-- Background decorations -->
<div class="wifi-deco">📶</div>
<div class="wifi-deco">📶</div>
<div class="wifi-deco">📶</div>
<div class="wifi-deco">📶</div>

<!-- Header -->
<div class="header">
  <div class="header-badge">🔓 Free Wi-Fi Connected</div>
  <h1 class="headline">А кто это тут<br><span>повёлся на бесплатный Wi-Fi?</span></h1>
</div>

<!-- Monkey Image -->
<div class="image-wrap">
  <div class="image-frame">
    <span class="emoji-burst">😂</span>
    <span class="emoji-burst">🐒</span>
    <span class="emoji-burst">💀</span>
    <span class="emoji-burst">🤣</span>
    <span class="emoji-burst">😆</span>
    <img class="monkey-img" src="/mnt/user-data/uploads/IMG_2361.jpeg" alt="Хитрый обезьян" onerror="this.style.display='none'; document.getElementById('fallback').style.display='flex'">
    <div id="fallback" style="display:none; width:clamp(240px,60vw,380px); height:clamp(240px,60vw,380px); background:rgba(255,214,0,0.1); border-radius:28px; align-items:center; justify-content:center; font-size:10rem;">🐒</div>
  </div>
</div>

<!-- Counter -->
<div class="counter-section">
  <div class="counter-label">🌐 Счётчик жертв бесплатного Wi-Fi</div>
  <div class="counter-box">
    <span class="counter-icon">👀</span>
    <span class="counter-number" id="visitCount">0</span>
    <div class="counter-suffix">
      <strong>человек</strong>
      попались за всё время
    </div>
  </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast">+1 Новая жертва! 🐒</div>

<script>
  // Persistent counter using localStorage
  const KEY = 'wifi_prank_visitors_v1';

  function getCount() {
    try {
      return parseInt(localStorage.getItem(KEY) || '0', 10);
    } catch(e) { return 0; }
  }

  function setCount(n) {
    try { localStorage.setItem(KEY, n); } catch(e) {}
  }

  function animateNumber(el, from, to, duration) {
    const start = performance.now();
    function step(now) {
      const p = Math.min((now - start) / duration, 1);
      const ease = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(from + (to - from) * ease);
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = to;
    }
    requestAnimationFrame(step);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  function bumpNumber(el) {
    el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 350);
  }

  // On load: increment counter
  window.addEventListener('DOMContentLoaded', () => {
    const prev = getCount();
    const next = prev + 1;
    setCount(next);

    const el = document.getElementById('visitCount');

    // Animate from 0 to new count
    setTimeout(() => {
      animateNumber(el, 0, next, 1200);
    }, 600);

    // Show toast after animation
    setTimeout(() => {
      bumpNumber(el);
      showToast('+ ты! Ещё один попался 🐒');
    }, 1900);
  });
</script>
</body>
</html>
